name: Sync android14-6.1-2025-12 with upstream

on:
  schedule:
    # Daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android14-6.1-2025-12
        uses: actions/checkout@v4
        with:
          ref: android14-6.1-2025-12
          fetch-depth: 0
          filter: 'blob:none'

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://android.googlesource.com/kernel/common
          git fetch upstream android14-6.1-2025-12

      - name: Compare commits
        id: compare
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          UPSTREAM="$(git rev-parse FETCH_HEAD)"
          AHEAD="$(git rev-list --count FETCH_HEAD..HEAD)"
          BEHIND="$(git rev-list --count HEAD..FETCH_HEAD)"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "Mirror   : ${CURRENT:0:12} (ahead=${AHEAD})"
          echo "Upstream : ${UPSTREAM:0:12} (behind=${BEHIND})"

      - name: Fast-forward to upstream
        if: steps.compare.outputs.behind != '0' && steps.compare.outputs.ahead == '0'
        run: |
          set -euo pipefail
          git merge --ff-only FETCH_HEAD
          git push origin android14-6.1-2025-12

      - name: Write change summary
        if: always()
        env:
          CURRENT: ${{ steps.compare.outputs.current }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          AHEAD: ${{ steps.compare.outputs.ahead }}
          BEHIND: ${{ steps.compare.outputs.behind }}
        run: |
          set -euo pipefail
          {
            echo "## Sync android14-6.1-2025-12"
            echo
            echo "**Mirror:** \`${CURRENT:0:12}\`"
            echo "**Upstream:** \`${UPSTREAM:0:12}\`"
            echo
            if [ "${AHEAD}" = "0" ] && [ "${BEHIND}" = "0" ]; then
              echo "✅ Already in sync — no changes."
            elif [ "${AHEAD}" != "0" ]; then
              echo "⚠️ **Diverged:** mirror is ${AHEAD} commit(s) ahead of upstream."
              echo "Not fast-forwarded (ff-only policy); push was skipped."
            else
              echo "🔄 Pulled ${BEHIND} new commit(s) and fast-forwarded."
              echo
              echo "### Commits applied"
              echo '```'
              git log --oneline --no-merges "${CURRENT}..${UPSTREAM}" | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
