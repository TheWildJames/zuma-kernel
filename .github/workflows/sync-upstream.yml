name: Sync android14-6.1-2025-12 with upstream

on:
  schedule:
    # Daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # No checkout at all: compare SHA tips, then fast-forward the branch.
      # The current tip is read via ls-remote (no objects), so git skips its
      # local fast-forward check and GitHub's server -- which has the full
      # history -- is the authority on whether the push is a fast-forward.
      - name: Fetch upstream tip and compare
        id: compare
        run: |
          set -euo pipefail
          git init -q sync
          cd sync
          git remote add upstream https://android.googlesource.com/kernel/common
          CURRENT="$(git ls-remote https://github.com/TheWildJames/zuma-kernel.git \
            refs/heads/android14-6.1-2025-12 | cut -f1)"
          git fetch -q --depth=1 --filter=blob:none upstream android14-6.1-2025-12
          UPSTREAM="$(git rev-parse FETCH_HEAD)"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "Mirror   : ${CURRENT:0:12}"
          echo "Upstream : ${UPSTREAM:0:12}"
          if [ "${CURRENT}" = "${UPSTREAM}" ]; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
            echo "IN SYNC"
          else
            # Deepen upstream history down to the mirror tip: pulls full
            # objects for just the new commits (needed for the push).
            git fetch -q --shallow-exclude="${CURRENT}" upstream android14-6.1-2025-12
            BEHIND="$(git rev-list --count ${CURRENT}..FETCH_HEAD)"
            echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
            echo "Behind=${BEHIND}"
          fi

      - name: Fast-forward to upstream
        id: fast-forward
        if: steps.compare.outputs.behind != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd sync
          if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/TheWildJames/zuma-kernel.git" \
              FETCH_HEAD:refs/heads/android14-6.1-2025-12 2>/tmp/push-err; then
            echo "PUSHED android14-6.1-2025-12"
          else
            echo "REJECTED (diverged or non-ff): $(tail -3 /tmp/push-err)"
            echo "diverged=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Write change summary
        if: always()
        env:
          CURRENT: ${{ steps.compare.outputs.current }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          DIVERGED: ${{ steps.fast-forward.outputs.diverged }}
        run: |
          set -euo pipefail
          {
            echo "## Sync android14-6.1-2025-12"
            echo
            echo "**Mirror:** \`${CURRENT:0:12}\` → **\`${UPSTREAM:0:12}\`**"
            echo
            if [ "${BEHIND}" = "0" ]; then
              echo "✅ Already in sync — no changes."
            elif [ -n "${DIVERGED}" ]; then
              echo "⚠️  Push rejected: the mirror has local commits upstream lacks."
              echo "Fix manually (reset or rebase), then re-run."
            else
              echo "🔄 Pulled ${BEHIND} new commit(s) and fast-forwarded."
              echo
              echo "### Commits applied"
              echo '```'
              cd sync
              git log --oneline --no-merges "${CURRENT}..${UPSTREAM}" | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
